<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>자연선택 시뮬레이션 게임 (보호색 실험)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
      background-color: #d32f2f; /* 기준 배경 빨강 */
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* 상단 헤더 */
    header {
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(5px);
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .status-left h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffeb3b;
    }
    .status-left p {
      font-size: 0.82rem;
      color: #eee;
      margin-top: 3px;
    }
    .catch-badge {
      background: #c2185b;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.25);
    }
    
    /* 캔버스 영역 */
    #game-container {
      flex: 1;
      position: relative;
      background-color: #d32f2f;
      overflow: hidden;
      cursor: crosshair;
    }

    /* 원 개체 */
    .creature {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
      transition: transform 0.1s ease-out, opacity 0.2s ease-out;
      cursor: pointer;
    }
    .creature:active {
      transform: translate(-50%, -50%) scale(1.18);
    }
    /* 빨간색 원: 배경(#d32f2f)보다 살짝 더 밝고 선명한 레드(#ff3b30) + 부드러운 테두리 */
    .color-red {
      background-color: #ff3b30;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .color-orange {
      background-color: #ff9800;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .color-yellow {
      background-color: #ffeb3b;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    .color-green {
      background-color: #4caf50;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* 결과 / 번식 모달 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 15, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-card {
      background: #232323;
      color: #fff;
      border-radius: 18px;
      width: 100%;
      max-width: 500px;
      padding: 24px 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.65);
      text-align: center;
      border: 1px solid #444;
    }
    .modal-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffeb3b;
    }
    .modal-desc {
      font-size: 0.85rem;
      color: #ccc;
      margin-bottom: 20px;
      line-height: 1.45;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #2f2f2f;
      border-radius: 12px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #3f3f3f;
    }
    .dot-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin-bottom: 6px;
    }
    .color-name {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .survivor-count {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 10px;
    }
    .add-label {
      font-size: 0.72rem;
      color: #ffeb3b;
      margin-bottom: 4px;
    }
    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      margin-bottom: 8px;
    }
    .btn-step {
      background: #484848;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-step:active {
      background: #666;
    }
    /* 직접 숫자 입력창 */
    .num-input {
      width: 36px;
      height: 28px;
      background: #181818;
      border: 1px solid #555;
      border-radius: 6px;
      color: #ffeb3b;
      font-weight: bold;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
    }
    .num-input:focus {
      border-color: #ffeb3b;
    }
    .total-next-text {
      font-size: 0.75rem;
      color: #4caf50;
      font-weight: bold;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="status-left">
      <h1 id="gen-title">제 1 세대</h1>
      <p>눈을 떴을 때 가장 먼저 눈에 띄는 원을 터치하세요!</p>
    </div>
    <div class="catch-badge" id="catch-badge">
      포식: <span id="catch-num">0</span> / 5
    </div>
  </header>

  <div id="game-container"></div>

  <!-- 결과 및 다음 세대 설정 모달 -->
  <div id="result-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-title">사냥 완료! (생존 결과)</div>
      <p class="modal-desc">살아남은 수에 더해 <b>다음 세대에 추가할 개수</b>를<br>버튼 또는 숫자로 직접 입력하세요.</p>
      
      <div class="stats-grid">
        <!-- 빨강 -->
        <div class="stat-box">
          <div class="dot-preview color-red"></div>
          <div class="color-name">빨강</div>
          <div class="survivor-count" id="surv-red">생존: 0</div>
          <div class="add-label">추가 개수</div>
          <div class="stepper">
            <button class="btn-step" onclick="changeAdd('red', -1)">-</button>
            <input type="number" id="input-red" class="num-input" value="0" min="0" max="100" oninput="onInputChange('red')">
            <button class="btn-step" onclick="changeAdd('red', 1)">+</button>
          </div>
          <div class="total-next-text" id="tot-red">다음 총: 0</div>
        </div>
        <!-- 주황 -->
        <div class="stat-box">
          <div class="dot-preview color-orange"></div>
          <div class="color-name">주황</div>
          <div class="survivor-count" id="surv-orange">생존: 0</div>
          <div class="add-label">추가 개수</div>
          <div class="stepper">
            <button class="btn-step" onclick="changeAdd('orange', -1)">-</button>
            <input type="number" id="input-orange" class="num-input" value="0" min="0" max="100" oninput="onInputChange('orange')">
            <button class="btn-step" onclick="changeAdd('orange', 1)">+</button>
          </div>
          <div class="total-next-text" id="tot-orange">다음 총: 0</div>
        </div>
        <!-- 노랑 -->
        <div class="stat-box">
          <div class="dot-preview color-yellow"></div>
          <div class="color-name">노랑</div>
          <div class="survivor-count" id="surv-yellow">생존: 0</div>
          <div class="add-label">추가 개수</div>
          <div class="stepper">
            <button class="btn-step" onclick="changeAdd('yellow', -1)">-</button>
            <input type="number" id="input-yellow" class="num-input" value="0" min="0" max="100" oninput="onInputChange('yellow')">
            <button class="btn-step" onclick="changeAdd('yellow', 1)">+</button>
          </div>
          <div class="total-next-text" id="tot-yellow">다음 총: 0</div>
        </div>
        <!-- 초록 -->
        <div class="stat-box">
          <div class="dot-preview color-green"></div>
          <div class="color-name">초록</div>
          <div class="survivor-count" id="surv-green">생존: 0</div>
          <div class="add-label">추가 개수</div>
          <div class="stepper">
            <button class="btn-step" onclick="changeAdd('green', -1)">-</button>
            <input type="number" id="input-green" class="num-input" value="0" min="0" max="100" oninput="onInputChange('green')">
            <button class="btn-step" onclick="changeAdd('green', 1)">+</button>
          </div>
          <div class="total-next-text" id="tot-green">다음 총: 0</div>
        </div>
      </div>

      <button class="btn-primary" onclick="startNextGeneration()">다음 세대 섞기 & 시작</button>
    </div>
  </div>

  <script>
    const COLORS = ['red', 'orange', 'yellow', 'green'];
    let currentGeneration = 1;
    let catches = 0;
    const MAX_CATCHES = 5;

    let population = [];
    let addCounts = { red: 0, orange: 0, yellow: 0, green: 0 };
    let survivorsLast = { red: 0, orange: 0, yellow: 0, green: 0 };

    const container = document.getElementById('game-container');
    const genTitle = document.getElementById('gen-title');
    const catchNum = document.getElementById('catch-num');
    const modal = document.getElementById('result-modal');

    // 1세대 초기 개체수 (각 10개씩)
    function initFirstGen() {
      const initial = { red: 10, orange: 10, yellow: 10, green: 10 };
      spawnAll(initial);
    }

    function spawnAll(counts) {
      container.innerHTML = '';
      population = [];
      catches = 0;
      catchNum.textContent = '0';
      genTitle.textContent = `제 ${currentGeneration} 세대`;

      const rect = container.getBoundingClientRect();
      const w = rect.width || window.innerWidth;
      const h = rect.height || (window.innerHeight - 60);

      let idCounter = 0;
      COLORS.forEach(color => {
        const num = counts[color] || 0;
        for (let i = 0; i < num; i++) {
          const x = 30 + Math.random() * (w - 60);
          const y = 30 + Math.random() * (h - 60);
          population.push({ id: idCounter++, color, x, y });
        }
      });

      // 무작위로 섞기
      population.sort(() => Math.random() - 0.5);

      population.forEach(c => {
        const el = document.createElement('div');
        el.className = `creature color-${c.color}`;
        el.style.left = `${c.x}px`;
        el.style.top = `${c.y}px`;
        el.dataset.id = c.id;

        el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          onCatch(c.id, el);
        });

        container.appendChild(el);
      });
    }

    function onCatch(id, element) {
      if (catches >= MAX_CATCHES) return;

      element.style.transform = 'translate(-50%, -50%) scale(0)';
      element.style.opacity = '0';
      setTimeout(() => element.remove(), 120);

      population = population.filter(c => c.id !== id);
      catches++;
      catchNum.textContent = catches;

      if (catches >= MAX_CATCHES) {
        setTimeout(showResults, 300);
      }
    }

    function getSurvivorCounts() {
      const counts = { red: 0, orange: 0, yellow: 0, green: 0 };
      population.forEach(c => counts[c.color]++);
      return counts;
    }

    function updateCardUI(color) {
      document.getElementById(`input-${color}`).value = addCounts[color];
      const nextTotal = survivorsLast[color] + addCounts[color];
      document.getElementById(`tot-${color}`).textContent = `다음 총: ${nextTotal}`;
    }

    function showResults() {
      survivorsLast = getSurvivorCounts();
      COLORS.forEach(c => {
        document.getElementById(`surv-${c}`).textContent = `생존: ${survivorsLast[c]}`;
        // 기본값: 살아남은 수만큼 추가(2배 증식) 또는 0으로 시작
        addCounts[c] = survivorsLast[c];
        updateCardUI(c);
      });
      modal.classList.remove('hidden');
    }

    function changeAdd(color, delta) {
      addCounts[color] = Math.max(0, addCounts[color] + delta);
      updateCardUI(color);
    }

    function onInputChange(color) {
      const val = parseInt(document.getElementById(`input-${color}`).value, 10);
      addCounts[color] = isNaN(val) || val < 0 ? 0 : val;
      updateCardUI(color);
    }

    function startNextGeneration() {
      const nextCounts = {};
      COLORS.forEach(c => {
        nextCounts[c] = survivorsLast[c] + addCounts[c];
      });

      modal.classList.add('hidden');
      currentGeneration++;
      spawnAll(nextCounts);
    }

    window.addEventListener('load', () => {
      setTimeout(initFirstGen, 50);
    });
  </script>
</body>
</html>
